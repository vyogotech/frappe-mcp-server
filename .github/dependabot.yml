version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  # also moves the SHA pins in .github/workflows, which is the only thing that does
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # the base images in Dockerfile are pinned by digest, so nothing else moves them
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
