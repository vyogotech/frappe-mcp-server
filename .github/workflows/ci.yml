name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=3m

      - name: Check third-party notices are current
        run: make notices-check
      - name: No fmt.Print in service code
        run: "! grep -rn --include=*.go -E 'fmt\\.Print(ln|f)?\\(' internal | grep -v _test.go"

  maintainability:
    name: Maintainability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Unreachable functions
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.48.0
          test -z "$(deadcode ./...)"

      - name: Complexity and duplication budget
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --default=none --enable=gocyclo,dupl --timeout=3m

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lint markdown
        run: npx --yes markdownlint-cli2 "README.md" "docs/**/*.md"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the server and the STDIO binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SUFFIX: ${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
        run: |
          mkdir -p bin
          go build -o "bin/frappe-mcp-server-${SUFFIX}" .
          go build -o "bin/frappe-mcp-server-stdio-${SUFFIX}" ./cmd/mcp-stdio

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: frappe-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/frappe-mcp-server*
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.26.1
        with:
          args: "-fmt sarif -out results.sarif ./..."

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Run semgrep
        run: |
          pipx install semgrep
          semgrep scan --metrics=off --error --quiet --config p/golang .

  image:
    name: Build Image
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build the server image the stack deploys
        run: docker build -t frappe-mcp-server:ci .

  container:
    name: Build & Push Container
    runs-on: ubuntu-latest
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          make docker-build
          make docker-push
