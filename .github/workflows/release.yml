name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tag itself, so `go build` stamps it into the binary (Go 1.24+ reads the VCS tag)
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Build every platform
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [ "$os" = windows ] && ext=".exe"
            for name in frappe-mcp-server frappe-mcp-server-stdio; do
              pkg="."
              [ "$name" = frappe-mcp-server-stdio ] && pkg="./cmd/mcp-stdio"
              dir="dist/${name}-${os}-${arch}"
              mkdir -p "$dir"
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "${dir}/${name}-${os}-${arch}${ext}" "$pkg"
              cp env.example README.md LICENSE THIRD_PARTY_NOTICES "$dir/"
            done
          done

      - name: Package and checksum
        run: |
          cp sbom.cyclonedx.json dist/
          cd dist
          for dir in */; do
            name="${dir%/}"
            case "$name" in
              *-windows-*) zip -qr "${name}.zip" "$name" ;;
              *) tar czf "${name}.tar.gz" "$name" ;;
            esac
            rm -rf "$name"
          done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # create refuses a tag that already has a published release, so a re-run uploads instead
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --generate-notes --title "$TAG" dist/*
          fi
