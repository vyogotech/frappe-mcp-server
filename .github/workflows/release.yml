name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # the tag itself, so `go build` stamps it into the binary (Go 1.24+ reads the VCS tag)
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Build every platform
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [ "$os" = windows ] && ext=".exe"
            for name in frappe-mcp-server frappe-mcp-server-stdio; do
              pkg="."
              [ "$name" = frappe-mcp-server-stdio ] && pkg="./cmd/mcp-stdio"
              dir="dist/${name}-${os}-${arch}"
              mkdir -p "$dir"
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "${dir}/${name}-${os}-${arch}${ext}" "$pkg"
              cp env.example README.md LICENSE THIRD_PARTY_NOTICES "$dir/"
            done
          done

      - name: Package and checksum
        run: |
          cp sbom.cyclonedx.json dist/
          cd dist
          for dir in */; do
            name="${dir%/}"
            case "$name" in
              *-windows-*) zip -qr "${name}.zip" "$name" ;;
              *) tar czf "${name}.tar.gz" "$name" ;;
            esac
            rm -rf "$name"
          done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes --title "$TAG" dist/*
