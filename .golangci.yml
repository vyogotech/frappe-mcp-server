version: "2"

run:
  timeout: 3m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    # the four classes a server making outbound calls gets wrong; the v2 default group has none of them
    - bodyclose
    - sqlclosecheck
    - contextcheck
    - nilerr
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
    # the budgets: a function stays under 15 branches, and 150 tokens is as far as a block may be copied.
    # gocyclo and dupl are not in the enabled set above yet, because config.Load and Config.loadFromEnv are
    # still over; they run in the maintainability check, which enables them and reads these settings.
    gocyclo:
      min-complexity: 15
    dupl:
      threshold: 150

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
